name: Market-close data refresh

on:
  schedule:
    # Note: GitHub Actions cron only runs in UTC, so these UTC hours are picked
    # to match Israel Daylight Time (UTC+3) and will drift by ~1 hour during
    # the few weeks around DST transitions (Israel/EU/US switch on different dates).
    - cron: "0 17 * * *"   # ~20:00 Israel time -- shortly after TTF/ICE Endex close (~17:30 Amsterdam)
    - cron: "0 20 * * *"   # ~23:00 Israel time -- shortly after NYMEX settlement (~14:30 ET) for Brent/RBOB/ULSD
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python energy_dashboard.py --once

      - name: Commit data.json / ttf_history.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json ttf_history.json
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
