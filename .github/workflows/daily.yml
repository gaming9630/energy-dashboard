name: Daily data refresh

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC ~= 05:00-06:00 Israel time, after all markets close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python energy_dashboard.py --once

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
